version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/fraud-risk-app-main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "stop-fra-team"
    assignees:
      - "stop-fra-team"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps-frontend)"
      include: "scope"
    versioning-strategy: increase-if-necessary
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
      react:
        patterns:
          - "react"
          - "react-*"
      testing:
        patterns:
          - "jest"
          - "@testing-library/*"
          - "@types/jest"

  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "stop-fra-team"
    assignees:
      - "stop-fra-team"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps-backend)"
      include: "scope"
    versioning-strategy: increase-if-necessary
    groups:
      database:
        patterns:
          - "drizzle-*"
          - "postgres"
      api:
        patterns:
          - "hono"
          - "@hono/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(deps-actions)"
