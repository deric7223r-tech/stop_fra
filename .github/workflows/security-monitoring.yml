name: Security Monitoring

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Audit frontend dependencies
        working-directory: fraud-risk-app-main
        run: |
          npm audit --json > frontend-audit.json || true
          npm audit --audit-level=moderate

      - name: Audit backend dependencies
        working-directory: backend
        run: |
          npm audit --json > backend-audit.json || true
          npm audit --audit-level=moderate

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            fraud-risk-app-main/frontend-audit.json
            backend/backend-audit.json
          retention-days: 30

      - name: Create security issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 Security vulnerabilities detected';
            const body = `Security audit found vulnerabilities in dependencies.

            **Date**: ${new Date().toISOString()}
            **Workflow**: ${context.workflow}
            **Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Please review the audit reports and update vulnerable dependencies.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'dependencies']
            });

  snyk-security-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check frontend licenses
        working-directory: fraud-risk-app-main
        run: |
          npm ci
          license-checker --json --out frontend-licenses.json
          license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense"

      - name: Check backend licenses
        working-directory: backend
        run: |
          npm ci
          license-checker --json --out backend-licenses.json
          license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense"

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            fraud-risk-app-main/frontend-licenses.json
            backend/backend-licenses.json
          retention-days: 90

  outdated-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Check frontend outdated packages
        working-directory: fraud-risk-app-main
        run: |
          npm ci
          npm outdated --json > frontend-outdated.json || true

      - name: Check backend outdated packages
        working-directory: backend
        run: |
          npm ci
          npm outdated --json > backend-outdated.json || true

      - name: Create PR for dependency updates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Check if there are outdated packages
            let hasOutdated = false;
            if (fs.existsSync('fraud-risk-app-main/frontend-outdated.json')) {
              const frontendOutdated = JSON.parse(fs.readFileSync('fraud-risk-app-main/frontend-outdated.json'));
              hasOutdated = hasOutdated || Object.keys(frontendOutdated).length > 0;
            }
            if (fs.existsSync('backend/backend-outdated.json')) {
              const backendOutdated = JSON.parse(fs.readFileSync('backend/backend-outdated.json'));
              hasOutdated = hasOutdated || Object.keys(backendOutdated).length > 0;
            }

            if (hasOutdated) {
              const title = '⬆️  Dependency updates available';
              const body = `Automated dependency check found outdated packages.

              **Date**: ${new Date().toISOString()}

              Review the outdated dependencies and consider updating them.
              Check the workflow artifacts for detailed reports.`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies', 'enhancement']
              });
            }
