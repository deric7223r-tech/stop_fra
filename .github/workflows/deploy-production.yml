name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Verify all tests pass
        run: |
          cd fraud-risk-app-main && npm ci && npm test -- --ci
          cd ../backend && npm ci && npm test -- --ci

      - name: Check test coverage
        run: |
          cd fraud-risk-app-main && npm test -- --ci --coverage
          COVERAGE=$(npx nyc report --reporter=text-summary | grep "Lines" | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage below 80% - blocking production deployment"
            exit 1
          fi

      - name: Security audit
        run: |
          cd fraud-risk-app-main && npm audit --audit-level=high
          cd ../backend && npm audit --audit-level=high

  deploy-backend-production:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deployment-checks]
    environment:
      name: production
      url: https://api.stopfra.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --production

      - name: Build TypeScript
        working-directory: backend
        run: npx tsc

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz dist/ package.json package-lock.json

      - name: Deploy to production server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.PROD_HOST }}
          REMOTE_USER: ${{ secrets.PROD_USER }}
          SOURCE: "backend/"
          TARGET: "/var/www/stopfra-api"
          EXCLUDE: "/node_modules/, /coverage/, /.env, /.git/"
          SCRIPT_BEFORE: |
            echo "Creating backup..."
            timestamp=$(date +%Y%m%d_%H%M%S)
            cp -r /var/www/stopfra-api /var/www/backups/stopfra-api-$timestamp
            echo "Stopping production backend..."
            pm2 stop stopfra-api || true
          SCRIPT_AFTER: |
            cd /var/www/stopfra-api
            npm ci --production
            echo "Running database migrations..."
            npm run db:migrate
            echo "Restarting backend..."
            pm2 restart stopfra-api || pm2 start npm --name "stopfra-api" -- start
            pm2 save

      - name: Health check
        run: |
          sleep 15
          for i in {1..10}; do
            if curl -f https://api.stopfra.com/health; then
              echo "✅ Production backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/10)"
            sleep 3
          done
          echo "❌ Production backend health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.PROD_HOST }}
          REMOTE_USER: ${{ secrets.PROD_USER }}
          SCRIPT_AFTER: |
            echo "🔄 Rolling back to previous version..."
            timestamp=$(ls -t /var/www/backups | head -1)
            rm -rf /var/www/stopfra-api
            cp -r /var/www/backups/$timestamp /var/www/stopfra-api
            cd /var/www/stopfra-api
            pm2 restart stopfra-api

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '✅ Backend deployed to production successfully',
              attachments: [{
                color: 'good',
                text: `Version: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nDeployed by: ${{ github.actor }}`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '❌ Backend deployment to production FAILED',
              attachments: [{
                color: 'danger',
                text: `Version: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nRollback initiated`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-frontend-production:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deployment-checks, deploy-backend-production]
    environment:
      name: production
      url: https://stopfra.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: fraud-risk-app-main/package-lock.json

      - name: Install dependencies
        working-directory: fraud-risk-app-main
        run: npm ci

      - name: Build web app
        working-directory: fraud-risk-app-main
        run: npx expo export:web
        env:
          EXPO_PUBLIC_API_URL: https://api.stopfra.com
          NODE_ENV: production

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./fraud-risk-app-main/dist
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: stopfra.com,www.stopfra.com

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          custom_payload: |
            {
              text: '${{ job.status == 'success' && '✅' || '❌' }} Frontend deployed to production: ${{ job.status }}',
              attachments: [{
                color: '${{ job.status == 'success' && 'good' || 'danger' }}',
                text: `URL: https://stopfra.com\nVersion: ${{ github.ref_name }}`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  mobile-app-build:
    name: Build Mobile Apps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [pre-deployment-checks]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: fraud-risk-app-main/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: fraud-risk-app-main
        run: npm ci

      - name: Build iOS app
        working-directory: fraud-risk-app-main
        run: eas build --platform ios --non-interactive --no-wait
        env:
          EXPO_PUBLIC_API_URL: https://api.stopfra.com

      - name: Build Android app
        working-directory: fraud-risk-app-main
        run: eas build --platform android --non-interactive --no-wait
        env:
          EXPO_PUBLIC_API_URL: https://api.stopfra.com

      - name: Notify build started
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '📱 Mobile app builds started for version ${{ github.ref_name }}',
              attachments: [{
                color: 'good',
                text: 'iOS and Android builds in progress. Check EAS dashboard for status.'
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  post-deployment-tests:
    name: Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-backend-production, deploy-frontend-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test API endpoints
        run: |
          echo "Testing health endpoint..."
          curl -f https://api.stopfra.com/health || exit 1

          echo "Testing API info endpoint..."
          curl -f https://api.stopfra.com/api/v1 || exit 1

          echo "✅ API smoke tests passed"

      - name: Test frontend
        run: |
          echo "Testing frontend availability..."
          curl -f https://stopfra.com || exit 1
          echo "✅ Frontend smoke test passed"

      - name: Notify success
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '🎉 Production deployment complete and verified!',
              attachments: [{
                color: 'good',
                text: `Version: ${{ github.ref_name }}\nAll smoke tests passed\nFrontend: https://stopfra.com\nAPI: https://api.stopfra.com`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
